[package]
name = "roadstyle-spike"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Spike: the roads of the roadstyle style in Rust (docs/design/rust-spike.md)"

[lib]
crate-type = ["cdylib", "rlib"]     # cdylib: the wasm module; rlib: the native program (main.rs)

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# the versions of duckosm-rust (offline from the same cache); snap, not zstd: GeoPandas writes Snappy, and snap is pure Rust (wasm)
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
bytes = "1"
indexmap = "2"                      # the order of Python's dicts (the slots' groups)
rstar = "0.12"                      # the R-tree for the crossings (shapely STRtree)

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"           # the version of the wasm-bindgen program that makes the JavaScript glue

[profile.release]
lto = true
codegen-units = 1

[workspace]
