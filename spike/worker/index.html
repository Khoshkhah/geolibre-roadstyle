<!doctype html>
<meta charset="utf-8">
<title>rs worker</title>
<script type="module">
  // Steps 1 and 2 of the full port: give the worker the file and the look, as the plugin will; keep the result in window.__result
  const t0 = performance.now();
  const w = new Worker("worker.js", {type: "module"});
  w.onerror = (e) => { window.__result = {error: "worker: " + (e.message || "could not start")}; };
  w.onmessage = ({data}) => {
    const pageMs = Math.round(performance.now() - t0);
    window.__result = location.search.includes("times")            // ?times: only the times and the style's size (a big area)
      ? {times: data.times, error: data.error, styleMB: data.style && Math.round(data.style.length / 1e6), pageMs}
      : {...data, parquet: data.parquet ? Array.from(data.parquet) : null, pageMs};
  };
  const [db, look] = await Promise.all([
    fetch("map.duckdb").then((r) => r.arrayBuffer()),
    fetch("look.json").then((r) => r.text()),
  ]);
  w.postMessage({db, look}, [db]);
</script>
