<!doctype html>
<meta charset="utf-8">
<title>rs wasm</title>
<script type="module">
  // Spike S4: start the worker, give it the fixture, keep the result (with the time to get the style text back to the page)
  const t0 = performance.now();
  const w = new Worker("worker.js", {type: "module"});
  w.onerror = (e) => { window.__result = {error: "worker: " + (e.message || "could not start")}; };
  w.onmessage = ({data}) => { window.__result = {...data, pageMs: performance.now() - t0, receivedAt: performance.now()}; };
  const [parquet, look] = await Promise.all([
    fetch("roads.parquet").then((r) => r.arrayBuffer()),
    fetch("look.json").then((r) => r.text()),
  ]);
  w.postMessage({parquet, look, runs: Number(new URLSearchParams(location.search).get("runs") || 3)}, [parquet]);
</script>
