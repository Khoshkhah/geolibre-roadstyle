<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="t">How the plugin works</title>
  <desc id="d">A duckOSM .duckdb file goes to DuckDB and a Rust module in the browser (WebAssembly), which make a style and the planner data. The style is drawn by GeoLibre. The planner data goes to the routing code in JavaScript, which fills the route panel and the route line.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="920" height="330" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 90H258"/><path d="M450 90H508"/><path d="M700 90H748"/>
    <path d="M604 126V196"/><path d="M450 238H508" /><path d="M700 238H748"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#1f2937">
    <rect x="30" y="52" width="170" height="76" rx="12" fill="#fff4cc" stroke="#e0b100"/>
    <text x="115" y="84" font-weight="700">duckOSM</text><text x="115" y="106" font-size="13">the .duckdb file</text>
    <rect x="260" y="52" width="190" height="76" rx="12" fill="#ffe3d6" stroke="#ff6b35"/>
    <text x="355" y="84" font-weight="700">DuckDB + Rust</text><text x="355" y="106" font-size="13">in the browser (WebAssembly)</text>
    <rect x="510" y="52" width="190" height="76" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <text x="605" y="84" font-weight="700">style + planner data</text><text x="605" y="106" font-size="13">one JSON</text>
    <rect x="750" y="52" width="140" height="76" rx="12" fill="#e7f5ec" stroke="#2e9e5b"/>
    <text x="820" y="84" font-weight="700">GeoLibre map</text><text x="820" y="106" font-size="13">roads, layers, 3D</text>
    <rect x="510" y="198" width="190" height="76" rx="12" fill="#fde8f1" stroke="#d6336c"/>
    <text x="605" y="230" font-weight="700">Routing in JavaScript</text><text x="605" y="252" font-size="13">duckOSM's route-map code</text>
    <rect x="750" y="198" width="140" height="76" rx="12" fill="#e7f5ec" stroke="#2e9e5b"/>
    <text x="820" y="230" font-weight="700">Route panel</text><text x="820" y="252" font-size="13">route, steps, pins</text>
    <rect x="260" y="198" width="190" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="355" y="230" font-weight="700">A style file</text><text x="355" y="252" font-size="13">mapstyle --inline (fast)</text>
  </g>
  <path d="M450 238H508" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="355" y="304" text-anchor="middle" font-size="12" fill="#64748b">made once in normal Python: opens in about 1 second</text>
  <text x="115" y="160" text-anchor="middle" font-size="12" fill="#64748b">roads, turns, links</text>
</svg>
